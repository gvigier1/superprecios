<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SúperPrecios Panamá</title>
<meta name="description" content="Compara precios y ofertas de los supermercados de Panamá.">
<meta name="theme-color" content="#13293D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SúperPrecios">
<script data-goatcounter="https://gvigier.goatcounter.com/count" data-goatcounter-settings='{"no_onload": true}' async src="https://gc.zgo.at/count.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #13293D; --bg: #EEF3F1; --paper: #FFFFFF; --line: #D5DFDB; --muted: #5A6B66;
    --cheap: #0E7A55; --cheap-soft: #DCEFE6; --promo: #B5560F; --promo-soft: #FBE7D7; --bar: #C9D6D1;
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body); }
  .wrap { max-width: 720px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom)); }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--cheap); outline-offset: 2px; }

  header h1 { font: 700 1.75rem/1.1 var(--display); margin: 6px 0 4px; letter-spacing: -0.02em; }
  header p { margin: 0; color: var(--muted); }
  .install { display: none; margin-top: 12px; background: var(--ink); color: #fff; border: 0; border-radius: 999px; padding: 8px 16px; font-weight: 600; cursor: pointer; }

  .tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 4px; margin-top: 18px; }
  .tabs a { text-align: center; padding: 9px 0; border-radius: 9px; color: var(--muted); text-decoration: none; font-weight: 600; }
  .tabs a[aria-current=page] { background: var(--ink); color: #fff; }
  .tabs .n { display: inline-block; margin-left: 6px; font-size: .75rem; background: var(--promo); color: #fff; border-radius: 999px; padding: 0 7px; }

  .search { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 14px 0 8px; }
  .search input { width: 100%; padding: 13px 16px; border: 2px solid var(--line); border-radius: 12px; background: var(--paper); font-size: 1.05rem; }
  .search input:focus { outline: none; border-color: var(--ink); }
  .count { color: var(--muted); font-size: .85rem; margin-top: 8px; }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 12px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 6px 14px; font-size: .9rem; cursor: pointer; white-space: nowrap; }
  .chip[aria-pressed=true] { background: var(--ink); border-color: var(--ink); color: #fff; }

  ul.list { list-style: none; margin: 0; padding: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  ul.list > li + li { border-top: 1px solid var(--line); }
  ul.list a.row { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 14px 16px; color: inherit; text-decoration: none; }
  .mname { font: 600 1.06rem/1.25 var(--display); }
  .msub { color: var(--muted); font-size: .85rem; }
  .mprice { grid-row: span 2; align-self: center; text-align: right; white-space: nowrap; }
  .mprice b { font: 700 1.1rem/1.1 var(--display); color: var(--cheap); }
  .mprice small { color: var(--muted); font-size: .78rem; }
  .mprice small:first-child { display: block; }
  .mprice b + small { margin-left: 3px; }

  .of { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 12px; align-items: center; padding: 12px 16px; color: inherit; text-decoration: none; }
  .pct { grid-row: span 2; font: 700 1.05rem/1 var(--display); color: var(--promo); background: var(--promo-soft); border-radius: 10px; padding: 10px 8px; min-width: 56px; text-align: center; }
  .of .nm { font-weight: 600; font-size: .95rem; line-height: 1.3; }
  .of .mt { color: var(--muted); font-size: .82rem; }
  .of .pr { grid-row: span 2; text-align: right; white-space: nowrap; font: 700 1.1rem/1.15 var(--display); color: var(--cheap); }
  .of .pr s { display: block; font: 400 .78rem var(--body); color: var(--muted); }

  .back { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 6px 0; color: var(--muted); cursor: pointer; font-weight: 600; }
  .det h2 { font: 700 1.6rem/1.15 var(--display); margin: 8px 0 2px; letter-spacing: -0.01em; }
  .det .cat { color: var(--muted); margin: 0 0 6px; }
  .det .hint { color: var(--muted); font-size: .88rem; margin: 0 0 16px; }
  .art { padding: 13px 16px; }
  .art.best { background: var(--cheap-soft); }
  .art .nm { font-weight: 600; line-height: 1.3; }
  .art .sz { color: var(--muted); font-size: .82rem; }
  .stores { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .st { display: inline-flex; align-items: baseline; gap: 6px; border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 5px 10px; font-size: .88rem; color: inherit; text-decoration: none; }
  .st b { font: 700 1rem var(--display); }
  .st.low { border-color: var(--cheap); }
  .st.low b { color: var(--cheap); }
  .st s { color: var(--muted); font-size: .78rem; }
  .st small { color: var(--muted); font-size: .75rem; }
  .tag { display: inline-block; font-size: .72rem; font-weight: 600; padding: 1px 8px; border-radius: 999px; margin-left: 6px; vertical-align: 1px; }
  .tag.cheap { background: var(--cheap); color: #fff; }
  .tag.promo { background: var(--promo-soft); color: var(--promo); }
  .tag.new { background: var(--ink); color: #fff; }
  .tag.out { background: var(--bg); color: var(--muted); }

  .msg { background: var(--paper); border: 1px dashed var(--line); border-radius: 14px; padding: 20px; color: var(--muted); }
  .msg strong { color: var(--ink); }
  footer { margin-top: 28px; color: var(--muted); font-size: .82rem; line-height: 1.5; }
  footer p { margin: 0 0 8px; }
  @media (prefers-reduced-motion: no-preference) { .det, ul.list { animation: in .2s ease-out; } @keyframes in { from { opacity: 0; transform: translateY(4px); } } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>SúperPrecios Panamá</h1>
    <p>Compara precios y ofertas de los supermercados.</p>
    <button class="install" id="install" type="button">Instalar la app</button>
  </header>
  <nav class="tabs" aria-label="Secciones">
    <a href="#" id="tab-p">Productos</a>
    <a href="#ofertas" id="tab-o">Ofertas</a>
  </nav>
  <main id="view" aria-live="polite"><div class="msg" style="margin-top:16px">Cargando precios…</div></main>
  <footer>
    <p id="updated"></p>
    <p>Precios tomados de las tiendas en línea de cada supermercado. Pueden variar en la sucursal. Las ofertas marcadas «Más bajo en 30 días» se comparan con los precios que registramos cada día.</p>
  </footer>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fold = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const money = v => "$" + v.toFixed(2);
const BASE = { kg: "por kg", l: "por litro", u: "c/u" };

// Statistiques anonymes (GoatCounter : sans cookies, sans données personnelles)
const STANDALONE = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const gcQueue = [];
function stat(path, title, event = false) { gcQueue.push({ path: "super/" + path, title: title || path, event }); flushStats(); }
function flushStats() {
  if (!window.goatcounter || !window.goatcounter.count) { setTimeout(flushStats, 1500); return; }
  while (gcQueue.length) { try { window.goatcounter.count(gcQueue.shift()); } catch {} }
}
const slug = s => fold(s).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40);
let searchTimer = null;
function statSearch(text, found) {
  clearTimeout(searchTimer);
  const t = slug(text);
  if (t.length < 3) return;
  searchTimer = setTimeout(() => stat((found ? "buscar/" : "buscar-sin-resultado/") + t, text, true), 1500);
}

let DATA = null, q = "", cat = "Todos", sup = "Todos";

function fechaLarga(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString("es-PA", { day: "numeric", month: "long" }) + ", " + d.toLocaleTimeString("es-PA", { hour: "2-digit", minute: "2-digit" });
}
let lastTab = "p";
function tab(which) {
  if (which !== lastTab) { q = ""; lastTab = which; }      // chaque onglet a sa propre recherche
  for (const [id, w] of [["#tab-p", "p"], ["#tab-o", "o"]]) {
    if (w === which) $(id).setAttribute("aria-current", "page"); else $(id).removeAttribute("aria-current");
  }
}
function sizeTxt(x) {
  if (!x.q) return "";
  if (x.u === "u") return `${x.q} unidades`;
  if (x.u === "kg") return x.q < 1 ? `${Math.round(x.q * 1000)} g` : `${+x.q.toFixed(2)} kg`;
  return x.q < 1 ? `${Math.round(x.q * 1000)} ml` : `${+x.q.toFixed(2)} l`;
}
function bestOf(p) {
  const xs = p.items.filter(x => x.pb != null && x.u === p.medida);
  if (xs.length) { const b = xs.reduce((a, c) => c.pb < a.pb ? c : a); return { v: b.pb, lab: BASE[p.medida] }; }
  return { v: Math.min(...p.items.map(x => x.p)), lab: "" };
}

function viewProductos() {
  tab("p");
  const cats = ["Todos", ...new Set(DATA.productos.map(p => p.categoria))];
  const words = fold(q).split(/\s+/).filter(Boolean);
  const hay = p => p._h || (p._h = fold([p.nombre, p.categoria, ...p.items.map(x => x.n + " " + (x.m || ""))].join(" ")));
  const list = DATA.productos.filter(p => (cat === "Todos" || p.categoria === cat) && words.every(w => hay(p).includes(w)));
  $("#view").innerHTML = `
    <div class="search">
      <input type="search" id="q" value="${esc(q)}" placeholder="Ej.: arroz, aceite, leche, Pelín" aria-label="Buscar producto" autocomplete="off">
      <div class="count">${list.length} producto${list.length === 1 ? "" : "s"}</div>
    </div>
    <div class="chips" role="group" aria-label="Categorías">
      ${cats.map(c => `<button class="chip" type="button" data-cat="${esc(c)}" aria-pressed="${c === cat}">${esc(c)}</button>`).join("")}
    </div>
    ${list.length ? `<ul class="list">${list.map(p => {
      const b = bestOf(p);
      return `<li><a class="row" href="#p/${p.id}">
        <span class="mname">${esc(p.nombre)}</span>
        <span class="mprice"><small>desde</small><b>${money(b.v)}</b>${b.lab ? `<small>${b.lab}</small>` : ""}</span>
        <span class="msub">${p.items.length} opciones en ${p.supers} súper${p.supers > 1 ? "s" : ""}</span>
      </a></li>`; }).join("")}</ul>`
    : `<div class="msg"><strong>No encontramos «${esc(q)}».</strong><br>Por ahora la app compara los productos más comprados. Prueba con otra palabra.</div>`}`;
  $("#q").addEventListener("input", e => { q = e.target.value; viewProductos(); const i = $("#q"); i.focus(); i.setSelectionRange(q.length, q.length); });
  document.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => { cat = b.dataset.cat; viewProductos(); }));
  if (q) statSearch(q, list.length > 0);
}

function viewProducto(id) {
  tab("p");
  const p = DATA.productos.find(x => x.id === id);
  if (!p) { location.hash = ""; return; }
  const S = DATA.supers;
  // un même article (même code-barres) vendu dans plusieurs supers = une seule ligne
  const groups = new Map();
  p.items.forEach((x, i) => { const key = x.k || "i" + i; if (!groups.has(key)) groups.set(key, []); groups.get(key).push(x); });
  const comparable = x => x.pb != null && x.u === p.medida;
  const rowVal = xs => Math.min(...xs.map(x => comparable(x) ? x.pb : Infinity));
  const rows = [...groups.values()].sort((a, b) => rowVal(a) - rowVal(b) || Math.min(...a.map(x => x.p)) - Math.min(...b.map(x => x.p)));
  const firstVal = rows.length ? rowVal(rows[0]) : Infinity;
  const html = rows.map((xs, n) => {
    xs.sort((a, b) => a.p - b.p);
    const name = xs.reduce((a, c) => c.n.length < a.length ? c.n : a, xs[0].n);
    const best = n === 0 && firstVal !== Infinity && rows.length > 1;
    const sz = sizeTxt(xs[0]);
    const unit = comparable(xs[0]) ? `${money(xs[0].pb)} ${BASE[p.medida]}` : "";
    const stores = xs.map((x, j) => `<a class="st${xs.length > 1 && j === 0 ? " low" : ""}" href="${esc(x.url || "#")}" target="_blank" rel="noopener" data-s="${esc(x.s)}">
        ${esc(S[x.s] || x.s)} <b>${money(x.p)}</b>${x.pa ? ` <s>${money(x.pa)}</s>` : ""}${x.stock === 0 ? " <small>agotado</small>" : ""}</a>`).join("");
    return `<li class="art${best ? " best" : ""}">
      <div class="nm">${esc(name)}${best ? '<span class="tag cheap">Mejor precio</span>' : ""}${xs.some(x => x.pa) ? '<span class="tag promo">Oferta</span>' : ""}</div>
      <div class="sz">${[sz, unit, xs.length > 1 ? `mismo producto en ${xs.length} súpers` : ""].filter(Boolean).join(" · ")}</div>
      <div class="stores">${stores}</div>
    </li>`;
  }).join("");
  $("#view").innerHTML = `<article class="det">
    <button class="back" type="button" id="back">← Todos los productos</button>
    <h2>${esc(p.nombre)}</h2>
    <p class="cat">${esc(p.categoria)}</p>
    <p class="hint">Ordenado por precio ${esc(BASE[p.medida] || "")}, para comparar empaques de distinto tamaño.</p>
    <ul class="list">${html}</ul>
  </article>`;
  $("#back").addEventListener("click", () => history.length > 1 ? history.back() : (location.hash = ""));
  document.querySelectorAll(".st").forEach(a => a.addEventListener("click", () => stat("tienda/" + a.dataset.s, "Ver en " + a.dataset.s, true)));
  stat("p/" + slug(p.nombre), p.nombre);
  window.scrollTo(0, 0);
}

function viewOfertas() {
  tab("o");
  const S = DATA.supers;
  const sups = ["Todos", ...new Set(DATA.ofertas.map(o => o.s))];
  const words = fold(q).split(/\s+/).filter(Boolean);
  const list = DATA.ofertas.filter(o => (sup === "Todos" || o.s === sup) && words.every(w => fold(o.n).includes(w)));
  $("#view").innerHTML = `
    <div class="search">
      <input type="search" id="q" value="${esc(q)}" placeholder="Buscar en las ofertas" aria-label="Buscar oferta" autocomplete="off">
      <div class="count">${list.length} oferta${list.length === 1 ? "" : "s"}, de la mayor a la menor rebaja</div>
    </div>
    <div class="chips" role="group" aria-label="Supermercados">
      ${sups.map(s => `<button class="chip" type="button" data-s="${esc(s)}" aria-pressed="${s === sup}">${esc(s === "Todos" ? s : (S[s] || s))}</button>`).join("")}
    </div>
    ${list.length ? `<ul class="list">${list.map(o => `<li><a class="of" href="#p/${o.i}">
        <span class="pct">−${o.d}%</span>
        <span class="nm">${esc(o.n)}${o.nueva ? '<span class="tag new">Nueva</span>' : ""}${o.v === "minimo" ? '<span class="tag cheap">Más bajo en 30 días</span>' : ""}</span>
        <span class="pr">${money(o.p)}<s>${money(o.pa)}</s></span>
        <span class="mt">${esc(S[o.s] || o.s)}${sizeTxt(o) ? ", " + sizeTxt(o) : ""}</span>
      </a></li>`).join("")}</ul>`
    : `<div class="msg"><strong>No hay ofertas${q ? ` para «${esc(q)}»` : ""}.</strong><br>Vuelve mañana: revisamos los precios cada noche.</div>`}`;
  $("#q").addEventListener("input", e => { q = e.target.value; viewOfertas(); const i = $("#q"); i.focus(); i.setSelectionRange(q.length, q.length); });
  document.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => { sup = b.dataset.s; viewOfertas(); }));
  stat("ofertas", "Ofertas");
}

function route() {
  if (!DATA) return;
  const m = location.hash.match(/^#p\/(\d+)/);
  if (m) viewProducto(+m[1]);
  else if (location.hash === "#ofertas") viewOfertas();
  else viewProductos();
}

async function load() {
  stat(STANDALONE ? "inicio-app" : "inicio", STANDALONE ? "Inicio (app instalada)" : "Inicio (navegador)");
  try {
    const r = await fetch("precios.json", { cache: "no-cache" });
    DATA = await r.json();
    const n = DATA.ofertas.length;
    if (n) $("#tab-o").innerHTML = `Ofertas<span class="n">${n}</span>`;
    $("#updated").textContent = `Precios actualizados: ${fechaLarga(DATA.generado)} (${Object.keys(DATA.supers).length} supermercados)`;
    route();
  } catch {
    $("#view").innerHTML = `<div class="msg" style="margin-top:16px"><strong>No se pudieron cargar los precios.</strong><br>Revisa tu conexión a internet y vuelve a abrir la app.</div>`;
  }
}

window.addEventListener("hashchange", route);
let deferred = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; $("#install").style.display = "inline-block"; });
$("#install").addEventListener("click", async () => { if (!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; $("#install").style.display = "none"; });
window.addEventListener("appinstalled", () => stat("instalada", "App instalada", true));
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
load();
</script>
</body>
</html>
